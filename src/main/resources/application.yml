spring:
  application:
    name: wallet-system
  datasource:
    url: jdbc:h2:file:./data/walletdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: my-super-secret-key-for-wallet-system-12345678901234567890
  expiration-ms: 86400000

server:
  port: 8080
